# DEMO ONLY. Plain secret, values from committed values.yaml. No secret manager on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ap.name" . }}-secrets
  labels:
    {{- include "ap.labels" . | nindent 4 }}
type: Opaque
stringData:
  AP_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  AP_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
